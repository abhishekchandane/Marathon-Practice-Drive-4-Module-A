<!DOCTYPE html>
<html>
<head>
    <title> A6</title>

    <style>
        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ddd;
            z-index: 999;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 6px solid transparent;
            border-top-color: blue;
            border-right-color: blue;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Actual Page -->
    <h2>Heavy HTML Page</h2>
    <p>This page is displayed after loading.</p>

    <img src="https://picsum.photos/id/870/200/300?grayscale&blur=2">

    <script>
        window.onload = function () {
            document.getElementById("loader").style.display = "none";
        };
    </script>

</body>
</html>
